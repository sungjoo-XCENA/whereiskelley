name: Collect 1000 Wine-Searcher merchants from Wayback

on:
  push:
    branches:
      - poc/wine-searcher-1000-20260813
    paths:
      - "poc/archive_org_wine_searcher_collect.py"
      - ".github/workflows/archive-org-wine-searcher-collect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m py_compile poc/archive_org_wine_searcher_collect.py
      - name: Collect 1000 archived public merchant profiles
        run: |
          python poc/archive_org_wine_searcher_collect.py \
            --count 1000 \
            --cdx-limit 15000 \
            --from-year 2024 \
            --to-year 2026 \
            --pilot 25 \
            --workers 4 \
            --interval 0.22 \
            --timeout 30 \
            --retries 2 \
            --output-dir artifacts/wine-searcher-wayback-poc
      - name: Show summary
        if: always()
        run: |
          if [ -f artifacts/wine-searcher-wayback-poc/summary.json ]; then
            cat artifacts/wine-searcher-wayback-poc/summary.json
          fi
      - name: Upload CSV, SQLite, index, summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-searcher-wayback-1000-poc
          path: artifacts/wine-searcher-wayback-poc/
          if-no-files-found: warn
          retention-days: 7
