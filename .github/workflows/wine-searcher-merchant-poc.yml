name: Wine-Searcher merchant 1000-page PoC

on:
  push:
    branches:
      - poc/wine-searcher-1000-20260813
    paths:
      - "poc/wine_searcher_1000.py"
      - ".github/workflows/wine-searcher-merchant-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PoC branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Validate collector syntax
        run: python -m py_compile poc/wine_searcher_1000.py

      - name: Collect public merchant profiles
        run: |
          python poc/wine_searcher_1000.py \
            --start 2 \
            --count 1000 \
            --pilot-count 30 \
            --workers 3 \
            --min-interval 0.35 \
            --timeout 20 \
            --retries 2 \
            --output-dir artifacts/wine-searcher-poc

      - name: Print compact result
        if: always()
        run: |
          if [ -f artifacts/wine-searcher-poc/summary.json ]; then
            cat artifacts/wine-searcher-poc/summary.json
          else
            echo "summary.json was not produced"
          fi

      - name: Upload CSV, SQLite and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-searcher-merchant-poc
          path: artifacts/wine-searcher-poc/
          if-no-files-found: warn
          retention-days: 7
