name: Probe Common Crawl Wine-Searcher merchant inventory

on:
  push:
    branches:
      - poc/wine-searcher-1000-20260813
    paths:
      - "poc/commoncrawl_wine_searcher_probe.py"
      - ".github/workflows/commoncrawl-wine-searcher-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python poc/commoncrawl_wine_searcher_probe.py | tee commoncrawl-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commoncrawl-wine-searcher-probe
          path: commoncrawl-probe.log
          retention-days: 7
